version: "3.9"

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/data:/app/data
      - ../backend/knowledge_base:/app/knowledge_base
    env_file:
      - ../backend/.env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../widget/dist:/usr/share/nginx/html/widget:ro
      - ../admin:/usr/share/nginx/html/admin:ro
    depends_on:
      - backend
    restart: unless-stopped
